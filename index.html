<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para Xiomara 🌻💛</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: linear-gradient(135deg, #0d0d12 0%, #1a1a2e 100%);
      color: #ffffff;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 15px 50px 15px;
      overflow-x: hidden;
      position: relative;
    }

    /* Animación Lluvia de Flores */
    .flower-rain {
      position: fixed;
      top: -10%;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .flower {
      position: absolute;
      top: -10%;
      font-size: 24px;
      user-select: none;
      animation: fall linear infinite;
    }

    @keyframes fall {
      0% {
        transform: translateY(0vh) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(115vh) rotate(360deg);
        opacity: 0.3;
      }
    }

    .container {
      position: relative;
      z-index: 2;
      max-width: 500px;
      width: 100%;
      text-align: center;
    }

    h1 {
      color: #ffd700;
      font-size: 2rem;
      margin-bottom: 20px;
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
    }

    /* Carta estilo tarjeta elegante */
    .card {
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 215, 0, 0.3);
      border-radius: 20px;
      padding: 25px 20px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      margin-bottom: 30px;
      text-align: center;
    }

    .letter-text {
      font-size: 1.15rem;
      line-height: 1.8;
      color: #fce38a;
      white-space: pre-line;
      min-height: 100px;
    }

    .cursor {
      display: inline-block;
      width: 3px;
      background-color: #ffd700;
      animation: blink 0.7s infinite;
      margin-left: 2px;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>
</head>
<body>

  <!-- Lluvia de Flores Amarillas -->
  <div class="flower-rain" id="rainContainer"></div>

  <div class="container">
    <h1>✨🌻 Feliz Día de las Flores Amarillas 🌻✨</h1>

    <div class="card">
      <div class="letter-text" id="typewriterText"></div><span class="cursor" id="cursor"></span>
    </div>
  </div>

  <script>
    // Carta Completa
    const textToType = `✨🌻 Feliz Día de las Flores Amarillas, mi niña linda 💛✨

Aunque hoy la distancia no nos deje estar juntos, quería hacerte sentir cerquita 🌎. Hoy es un día para recordarte lo bonito que se siente tenerte en mi vida y lo mucho que iluminas mis días ❤️.

No importa lo que esté haciendo o si estoy en la escuela, siempre hay algo que me acuerda a ti y me saca una sonrisa 💭✨. Me llena el corazón de ilusión pensar en el futuro que nos espera y en el momento en que por fin podamos compartirlo todo juntos 🏡💖.

Confía en que cada día falta menos para que vaya por ti, te abrace muy fuerte y pueda estar ahí a tu lado, apoyándote a cumplir cada uno de tus sueños y tus estudios 💗.

Sé que a veces la distancia pesa, pero también nos enseña que lo nuestro es real y que vale la pena cada segundo de espera ✨. Gracias por tu cariño y por ser ese lugarcito seguro al que siempre quiero volver. Eres mi persona favorita y lo más bonito que me ha pasado 💫.

Te amo con todo mi corazón 💛🌻💖`;

    // Efecto Lluvia de Flores (Mantenido completamente intacto)
    const rainContainer = document.getElementById('rainContainer');
    const flowers = ['🌻', '🌼', '✨', '💛', '🌸'];

    function createFlower() {
      const flower = document.createElement('div');
      flower.classList.add('flower');
      flower.innerText = flowers[Math.floor(Math.random() * flowers.length)];
      flower.style.left = Math.random() * 100 + 'vw';
      flower.style.animationDuration = Math.random() * 3 + 4 + 's';
      flower.style.fontSize = Math.random() * 15 + 18 + 'px';
      rainContainer.appendChild(flower);

      setTimeout(() => {
        flower.remove();
      }, 7000);
    }

    setInterval(createFlower, 300);

    // Efecto Máquina de Escribir para la Carta
    let index = 0;
    const speed = 45; // Velocidad de escritura en ms
    const typewriterElement = document.getElementById('typewriterText');
    const cursor = document.getElementById('cursor');

    function typeWriter() {
      if (index < textToType.length) {
        typewriterElement.textContent += textToType.charAt(index);
        index++;
        setTimeout(typeWriter, speed);
      } else {
        cursor.style.display = 'none';
      }
    }

    window.onload = () => {
      setTimeout(typeWriter, 1000);
    };
  </script>
</body>
</html>
