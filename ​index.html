<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flores Amarillas 🌻</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #fff9c4, #fff176);
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      text-align: center;
    }

    .container {
      background: rgba(255, 255, 255, 0.85);
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      max-width: 90%;
      width: 400px;
      z-index: 10;
      position: relative;
      backdrop-filter: blur(5px);
    }

    h1 {
      color: #f57f17;
      font-size: 26px;
      margin-bottom: 10px;
    }

    p {
      color: #5d4037;
      font-size: 16px;
      line-height: 1.5;
    }

    .flower-icon {
      font-size: 60px;
      margin: 15px 0;
      animation: pulse 1.5s infinite alternate;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.15); }
    }

    /* Animación de los elementos cayendo */
    .falling-element {
      position: absolute;
      top: -50px;
      font-size: 24px;
      user-select: none;
      pointer-events: none;
      animation: fall linear infinite;
    }

    @keyframes fall {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(100vh) rotate(360deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="flower-icon">🌻</div>
    <h1>¡Feliz 21 de Septiembre!</h1>
    <p>Para la persona más especial. Estas flores amarillas son un detalle para recordarte cuánto te quiero y lo importante que eres para mí. 💛</p>
  </div>

  <script>
    // Arreglo con flores amarillas, corazones amarillos y rosas
    const items = ['🌻', '💛', '🌸', '💖', '✨', '🌼'];

    function createFallingItem() {
      const element = document.createElement('div');
      element.classList.add('falling-element');
      
      // Selecciona un ícono al azar de la lista
      element.innerText = items[Math.floor(Math.random() * items.length)];
      
      // Posición horizontal aleatoria
      element.style.left = Math.random() * 100 + 'vw';
      
      // Duración de la caída aleatoria (entre 3 y 6 segundos)
      const duration = Math.random() * 3 + 3;
      element.style.animationDuration = duration + 's';
      
      // Tamaño aleatorio
      element.style.fontSize = (Math.random() * 15 + 15) + 'px';

      document.body.appendChild(element);

      // Eliminar el elemento después de que termine la animación
      setTimeout(() => {
        element.remove();
      }, duration * 1000);
    }

    // Crear un elemento cayendo cada 300 milisegundos
    setInterval(createFallingItem, 300);
  </script>

</body>
</html>
